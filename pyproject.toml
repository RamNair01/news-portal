[project]
name = "rams-news-portal"
version = "0.1.0"
description = "Personal locally-hosted news dashboard"
requires-python = ">=3.11"
dependencies = [
    "feedparser>=6.0",
    "flask>=3.0",
    "openai>=1.0",
    "google-api-python-client>=2.0",
    "google-auth-httplib2>=0.2",
    "google-auth-oauthlib>=1.0",
    "apscheduler>=3.10",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "beautifulsoup4>=4.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fetcher", "ai", "db", "server"]
